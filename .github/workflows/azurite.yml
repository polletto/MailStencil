name: Azure Blob integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/MailStencil.AzureBlob/**'
      - 'src/MailStencil.Core/**'
      - 'src/MailStencil.Scriban/**'
      - 'tests/MailStencil.AzureBlob.Tests/**'
      - '.github/workflows/azurite.yml'
      - 'Directory.Build.props'
permissions:
  contents: read
jobs:
  azurite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Start local emulator
        run: |
          docker run --rm -d --name mailstencil-azurite -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 azurite-blob --blobHost 0.0.0.0 --silent
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:10000/; then exit 0; fi
            sleep 1
          done
          docker logs mailstencil-azurite
          exit 1
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Run actual emulator tests
        env:
          MAILSTENCIL_AZURITE: '1'
        run: dotnet test tests/MailStencil.AzureBlob.Tests -c Release --no-build --no-restore --filter Category=Azurite
      - name: Emulator logs and cleanup
        if: always()
        run: |
          docker logs mailstencil-azurite || true
          docker stop mailstencil-azurite || true
